name: Data ophalen en deployen
on:
  schedule:
    - cron: "7 * * * *"   # elk uur op :07
  workflow_dispatch:      # handmatig starten via het tabblad Actions
  push:
    branches: [main]

permissions:
  contents: write         # nodig om de opgehaalde data terug te zetten in de repository
  pages: write            # nodig om naar GitHub Pages te publiceren
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Stap 1: data ophalen, site bouwen en klaarzetten
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: RWS-data ophalen
        run: npm run fetch-data
      - name: Laatste geldige data bewaren
        run: |
          git config user.name "waterweer-bot"
          git config user.email "bot@waterweer.nl"
          git add data/metingen
          if ! git diff --cached --quiet; then
            git commit -m "data: update $(date -u +%FT%TZ)"
            git push || echo "Push van data mislukt, deploy gaat door"
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Site klaarzetten voor GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Stap 2: publiceren, in een aparte job zodat het klaargezette pakket altijd te vinden is
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.opnieuw.outputs.page_url }}
    steps:
      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Even wachten en opnieuw proberen
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Publiceren (tweede poging)
        id: opnieuw
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
